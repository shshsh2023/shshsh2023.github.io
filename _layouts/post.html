---
layout: default
---

<article class="card post glow">
  <header class="post-head">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time>{{ page.date | date: "%Y-%m-%d" }}</time>
      {% if page.categories and page.categories.size > 0 %}
        <span class="dot">·</span> <span>{{ page.categories | join: " / " }}</span>
      {% endif %}
    </div>
  </header>
  <div class="content">
    {{ content }}
  </div>
</article>

<a class="card back glow" href="{{ '/' | relative_url }}">← 返回首页</a>
